<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도서 인식 스마트 앱</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js" defer></script>
</head>

<body>
    <button id="settingsBtn" class="top-right-btn" aria-label="설정">
        <svg viewBox="0 0 24 24">
            <path
                d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.48.48 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" />
        </svg>
    </button>

    <main>
        <section id="searchPage" class="page active">
            <article class="card-container">
                <h1>도서 검색</h1>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="도서명이나 저자명을 입력하세요..." />
                    <button id="searchBtn" class="search-icon-btn" aria-label="검색">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
                        </svg>
                    </button>
                </div>

                <div class="filter-box" style="display: flex; gap: 0.5rem; margin-top: 0.5rem; width: 100%;">
                    <select id="ddcSelect"
                        style="flex: 1; padding: 0.75rem; border: 1px solid #E9ECEF; border-radius: 8px; font-size: 0.9rem; outline: none;">
                        <option value="">분류 전체</option>
                        <option value="0">000 총류</option>
                        <option value="1">100 철학</option>
                        <option value="2">200 종교</option>
                        <option value="3">300 사회과학</option>
                        <option value="4">400 자연과학</option>
                        <option value="5">500 기술과학</option>
                        <option value="6">600 예술</option>
                        <option value="7">700 언어</option>
                        <option value="8">800 문학</option>
                        <option value="9">900 역사</option>
                    </select>

                    <select id="sortBySelect"
                        style="flex: 1; padding: 0.75rem; border: 1px solid #E9ECEF; border-radius: 8px; font-size: 0.9rem; outline: none;">
                        <option value="accuracy" selected>정확도순</option>
                        <option value="title">제목순</option>
                        <option value="author">작가순</option>
                        <option value="ddc">분류기호순</option>
                    </select>

                    <button id="sortOrderToggle" data-order="asc"
                        style="padding: 0.75rem 1rem; border: 1px solid #E9ECEF; border-radius: 8px; background: white; font-size: 0.9rem; font-weight: bold; cursor: pointer; color: var(--text-dark);">
                        오름차순 ▲
                    </button>
                </div>

                <div id="imageSearchContainer" class="image-search-wrapper" style="display: none;">
                    <button id="startCameraBtn" class="action-btn mint-btn image-search-btn">
                        <svg viewBox="0 0 24 24" class="btn-icon">
                            <path
                                d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm8 3a5 5 0 0 0-5 5 5 5 0 0 0 5 5 5 5 0 0 0 5-5 5 5 0 0 0-5-5zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z" />
                        </svg>
                        <span>이미지(카메라)로 검색하기</span>
                    </button>
                    <p id="searchResultMessage" class="search-result-text"></p>
                </div>
            </article>
            <div id="bookList" class="book-list"></div>
            <div id="imageSearchContainer" class="image-search-wrapper" style="display: none;">
        </section>

        <section id="settingsPage" class="page">
            <article class="card-container">
                <div class="settings-header">
                    <button id="backBtn" class="back-btn">← 설정 닫기</button>
                    <h1>설정</h1>
                </div>
                <div style="min-height: 15rem;"></div>
            </article>
        </section>
    </main>

    <div id="cameraPage" class="fullscreen-camera">
        <button id="closeCameraBtn" class="close-btn">✕</button>

        <video id="video" autoPlay playsInline></video>
        <img id="photo" alt="Captured" />

        <div class="bottom-center-action">
            <button id="captureBtn" class="circle-action-btn capture">촬영</button>
            <button id="retryBtn" class="circle-action-btn retry" style="display: none;">다시 시도</button>
        </div>

        <canvas id="canvas" style="display: none;"></canvas>
    </div>
</body>

</html>
